[build-system]
requires = ["setuptools>=64", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "pdssm"
version = "0.1.0"
description = "PD-SSM layer with its CUDA scan"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "triton"]

[tool.setuptools]
packages = ["pdssm"]

[tool.setuptools.package-data]
pdssm = ["csrc/*"]
